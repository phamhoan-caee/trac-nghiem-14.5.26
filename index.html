<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG THI TRẮC NGHIỆM NGHỀ KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --header-blue: #0040cc;
            --btn-orange: #ff6600; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background-color: #000;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Arial, sans-serif; 
            overflow-x: hidden;
            transition: background-image 0.5s ease-in-out;
        }

        /* Glassmorphism hiệu ứng gương */
        .welcome-container, #quiz-content, .sidebar-right > div, #ai-container, .confirm-modal-content {
            background: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Nút AI */
        .ai-toggle-btn {
            background: white; border: 2px solid var(--btn-orange); border-radius: 50%;
            width: 35px; height: 35px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s;
        }
        .ai-toggle-btn.muted { border-color: #999; background: #f0f0f0; }
        .ai-toggle-btn svg { width: 20px; height: 20px; fill: var(--btn-orange); }
        .ai-toggle-btn.muted svg { fill: #999; }

        /* Backgrounds */
        .bg-xe-nang { background-image: url('https://raw.githubusercontent.com/phamhoan-caee/trac-nghiem-14.5.26/main/bg-xe-nang2.jpg'); }
        .bg-can-truc { background-image: url('https://raw.githubusercontent.com/phamhoan-caee/trac-nghiem-14.5.26/main/bg-can-truc.jpg'); }
        .bg-cau-truc { background-image: url('https://raw.githubusercontent.com/phamhoan-caee/trac-nghiem-14.5.26/main/bg-cau-truc.jpg'); }
        .bg-may-xuc { background-image: url('https://raw.githubusercontent.com/phamhoan-caee/trac-nghiem-8.5.26/main/bg-may-xuc.jpg'); }
        .bg-may-rai { background-image: url('https://raw.githubusercontent.com/phamhoan-caee/trac-nghiem-14.5.26/main/bg-may-rai.jpg'); }

        #ai-container {
            display: none; max-width: 1300px; margin: 10px auto; 
            padding: 12px 20px; align-items: center; gap: 15px; 
            border-left: 8px solid var(--btn-orange);
        }

        .progress-bar-bg { flex-grow: 1; height: 12px; background: #ddd; border-radius: 10px; overflow: hidden; }
        #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #28a745, #85ffbd); transition: width 0.4s; }

        .timer-floating {
            position: fixed; top: 10px; right: 10px;
            background: #ff3333; color: white; padding: 10px 20px; border-radius: 50px;
            font-weight: 900; font-size: 1.3rem; border: 2px solid white; z-index: 2000; display: none;
        }

        .welcome-container { width: 95%; max-width: 450px; padding: 30px; margin: auto; }
        .form-control { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-weight: 600; }
        .btn-start { background: var(--caee-blue); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        
        #quiz-screen { padding: 15px; display: none; grid-template-columns: 1fr 320px; gap: 20px; max-width: 1300px; margin: auto; }
        .option-item { border: 2px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; font-weight: 600; background: white; }
        .option-item.selected { border-color: var(--btn-blue); background: #eef2ff; }

        #result-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .result-card { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; }
        
        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 5px solid var(--caee-blue); margin: 15px auto; display: flex; flex-direction: column; justify-content: center; font-weight: 900; font-size: 2rem; }
        .status-badge { padding: 8px 25px; border-radius: 50px; color: white; font-weight: bold; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body oncontextmenu="return false" class="bg-xe-nang">

    <div id="timer" class="timer-floating">20:00</div>

    <div id="start-screen" style="min-height: 100vh; display: flex;">
        <div class="welcome-container">
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="font-size: 14px; color: var(--caee-blue); font-weight: bold;">TRƯỜNG CĐ CƠ ĐIỆN NÔNG NGHIỆP VÀ MÔI TRƯỜNG</div>
                <div style="font-size: 18px; color: #d32f2f; font-weight: 900; text-transform: uppercase;">KHOA MÁY THI CÔNG</div>
            </div>
            
            <label style="font-weight: bold; font-size: 0.8rem;">NGHỀ ĐÀO TẠO:</label>
            <select id="jobType" class="form-control" style="border: 2px solid orange;" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
                <option value="96215627">VẬN HÀNH MÁY XÚC</option> 
                <option value="1389423018">VẬN HÀNH MÁY RẢI</option> 
            </select>

            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN HỌC VIÊN" class="form-control" style="text-transform: uppercase;">
            <input type="text" id="studentDOB" placeholder="Ngày sinh: (VD: 12/04/2000)" class="form-control">
            
            <div style="display: flex; gap: 10px;">
                <input type="text" id="khoaThi" value="Tháng 6/2026" class="form-control" style="flex: 1.5; background: #eee;" readonly>
                <input type="password" id="maThi" placeholder="Mã thi" class="form-control" style="flex: 1;">
            </div>

            <div style="display:flex; align-items:center; margin: 10px 0; justify-content: center; gap:10px;">
                <input type="checkbox" id="modeToggle" style="width:18px; height:18px;">
                <label for="modeToggle" style="font-weight: 700; color: #0d47a1;">Chế độ ôn tập</label>
            </div>

            <button class="btn-start" id="btnStart" onclick="validateAndStart()">VÀO THI NGAY ➔</button>
        </div>
    </div>

    <div id="ai-container">
        <div style="width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid white;">
            <img src="https://raw.githubusercontent.com/phamhoan-caee/trac-nghiem-14.5.26/main/%E1%BA%A3nh%20nh%C3%A2n%20vat%20de%20thi.png" style="width: 100%; height:100%; object-fit: cover;">
        </div>
        <div style="flex-grow: 1;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-weight: 800; color: var(--caee-blue);">TRỢ LÝ ẢO CAEE</span>
                <button id="toggle-voice-btn" class="ai-toggle-btn" onclick="toggleVoice()">
                    <svg id="voice-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                </button>
            </div>
            <div class="progress-bar-bg"><div id="progress-fill"></div></div>
        </div>
        <div id="progress-text" style="font-weight: 800;">0/30</div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content"></div>
        <div class="sidebar-right">
            <div>
                <h4 style="margin-bottom:15px; text-align:center; color: var(--caee-blue);">SƠ ĐỒ CÂU HỎI</h4>
                <div id="nav-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:8px;"></div>
                <button id="submitBtn" class="btn-start" style="margin-top:18px;" onclick="finalizeSubmission()">NỘP BÀI</button>
            </div>
        </div>
    </div>

    <div id="result-screen">
        <div class="result-card">
            <h2 style="color: var(--caee-blue);">KẾT QUẢ THI</h2>
            <p id="res-info" style="margin: 10px 0; font-weight: 600;"></p>
            <div class="score-circle"><span id="res-score">0</span><small style="font-size: 0.9rem;">/30 câu</small></div>
            <div id="res-badge" class="status-badge">0.0 ĐIỂM</div>
            <p style="margin-top:15px; font-size: 0.8rem; color: #666;">Hệ thống sẽ tải lại sau <span id="countdown">15</span> giây...</p>
        </div>
    </div>

<script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVlApZlHDZWTFVWxMCnGIRYairZie19pyoOsuEK1O0kU3nAIVLbRIbxZVExZV0J_7q0M60mg2Wsem_/pub?output=csv&gid=";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwp_86HSuFplkwEzPrniWoW0UlmMUi2cRf46vpIDOYLT2-PGlU1tZ9RTsRtggMAtc-x/exec";
    
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentIdx = 0, timeLeft = 1200, timerInterval, isSubmitted = false, isVoice = true;
    const synth = window.speechSynthesis;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        const jobName = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
        
        // Đổi background
        document.body.className = '';
        if(jobName.includes("XE NÂNG")) document.body.classList.add('bg-xe-nang');
        else if(jobName.includes("MÁY XÚC")) document.body.classList.add('bg-may-xuc');
        else if(jobName.includes("CẦN TRỤC")) document.body.classList.add('bg-can-truc');
        else if(jobName.includes("CẦU TRỤC")) document.body.classList.add('bg-cau-truc');
        else if(jobName.includes("MÁY RẢI")) document.body.classList.add('bg-may-rai');

        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: (res) => {
                allQuestions = res.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi, 
                    options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "A",
                    explanation: i.Giaithich || "Tuân thủ an toàn vận hành.",
                    image: i["HINH ANH"] || ""
                }));
            }
        });
    }

    async function validateAndStart() {
        const name = document.getElementById('studentName').value.trim();
        const ma = document.getElementById('maThi').value.trim();
        if(!name || !ma) return alert("Vui lòng nhập Tên và Mã thi!");

        const btn = document.getElementById('btnStart');
        btn.disabled = true; btn.innerText = "ĐANG XÁC THỰC...";

        try {
            const url = `${WEB_APP_URL}?action=checkCode&code=${encodeURIComponent(ma)}&name=${encodeURIComponent(name.toUpperCase())}`;
            const res = await fetch(url);
            const data = await res.json();
            if(data.isValid) startQuiz();
            else { alert(data.message); btn.disabled = false; btn.innerText = "VÀO THI NGAY ➔"; }
        } catch(e) { alert("Lỗi kết nối máy chủ!"); btn.disabled = false; }
    }

    function startQuiz() {
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('ai-container').style.display = 'flex';
        document.getElementById('quiz-screen').style.display = 'grid';
        document.getElementById('timer').style.display = 'block';
        startTimer();
        showQuestion(0);
    }

    function showQuestion(idx) {
        currentIdx = idx;
        synth.cancel();
        const q = selectedQuestions[idx];
        const ans = studentAnswers.find(a => a.id === idx);
        const isOnTap = document.getElementById('modeToggle').checked;

        let html = `<h3>Câu ${idx + 1}: ${q.question}</h3>`;
        if(q.image) html += `<img src="${q.image}" style="max-width:100%; border-radius:10px; margin:10px 0;">`;
        
        q.options.forEach((opt, i) => {
            const labels = ['A','B','C','D'];
            const isSel = ans && ans.val === opt;
            html += `<div class="option-item ${isSel?'selected':''}" onclick="selectAns(${idx},'${opt.replace(/'/g,"\\'")}')"><b>${labels[i]}.</b> ${opt}</div>`;
        });

        if(isOnTap && ans) html += `<div style="background:#fff3cd; padding:10px; border-radius:8px; margin-top:10px;"><b>Giải thích:</b> ${q.explanation}</div>`;

        html += `<div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-start" onclick="showQuestion(${idx-1})" ${idx==0?'disabled':''} style="background:#666">Quay lại</button>
            <button class="btn-start" onclick="showQuestion(${idx+1})" ${idx==29?'disabled':''}>Tiếp theo</button>
        </div>`;

        document.getElementById('quiz-content').innerHTML = html;
        renderGrid();
        if(isVoice) speak(`Câu ${idx+1}: ${q.question}`);
    }

    function selectAns(idx, val) {
        const existing = studentAnswers.findIndex(a => a.id === idx);
        if(existing > -1) studentAnswers[existing].val = val;
        else studentAnswers.push({id: idx, val: val});
        showQuestion(idx);
        updateProgress();
    }

    function updateProgress() {
        const count = studentAnswers.length;
        document.getElementById('progress-fill').style.width = (count/30*100)+'%';
        document.getElementById('progress-text').innerText = count + '/30';
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = '';
        for(let i=0; i<30; i++) {
            const hasAns = studentAnswers.some(a => a.id === i);
            const isCur = i === currentIdx;
            grid.innerHTML += `<div onclick="showQuestion(${i})" style="padding:10px; text-align:center; cursor:pointer; border-radius:5px; font-weight:bold; ${hasAns?'background:var(--caee-blue);color:white;':'background:#eee;'} ${isCur?'border:2px solid orange;':''}">${i+1}</div>`;
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            const m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) finalizeSubmission();
        }, 1000);
    }

    async function finalizeSubmission() {
        if(isSubmitted) return;
        isSubmitted = true;
        clearInterval(timerInterval);
        synth.cancel();

        let correct = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.id === i);
            const labels = ['A','B','C','D'];
            if(ans && labels[q.options.indexOf(ans.val)] === q.answer) correct++;
        });

        const score10 = (correct/30*10).toFixed(1);
        const status = score10 >= 8.3 ? "ĐẠT" : "KHÔNG ĐẠT";

        document.getElementById('res-info').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('res-score').innerText = correct;
        document.getElementById('res-badge').innerText = score10 + " ĐIỂM";
        document.getElementById('res-badge').style.background = status === "ĐẠT" ? "green" : "red";
        document.getElementById('result-screen').style.display = 'flex';

        // Gửi data về Google Sheets
        const formData = new URLSearchParams();
        formData.append('maThi', document.getElementById('maThi').value);
        formData.append('name', document.getElementById('studentName').value);
        formData.append('birthDate', document.getElementById('studentDOB').value);
        formData.append('score', correct + "/30");
        formData.append('status', status);
        formData.append('ngheName', document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text);
        formData.append('khoaThi', document.getElementById('khoaThi').value);

        fetch(WEB_APP_URL, { method: 'POST', body: formData, mode: 'no-cors' });

        let c = 15;
        setInterval(() => { if(c > 0) document.getElementById('countdown').innerText = --c; else location.reload(); }, 1000);
    }

    function speak(text) {
        if(!isVoice) return;
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = 'vi-VN'; ut.rate = 1.1;
        synth.speak(ut);
    }

    function toggleVoice() {
        isVoice = !isVoice;
        document.getElementById('toggle-voice-btn').classList.toggle('muted', !isVoice);
        if(!isVoice) synth.cancel();
    }

    window.onload = preloadQuestions;
</script>
</body>
</html>
